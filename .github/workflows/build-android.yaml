jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > src-tauri/gen/android/app/google-services.json

      - name: Build Android APK
        run: pnpm tauri android build
